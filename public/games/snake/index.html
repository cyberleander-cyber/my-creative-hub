<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Snake</title>
<style>
  html,body{margin:0;height:100%;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center}
  canvas{background:#1e293b;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  h1{margin:0 0 12px;font-size:20px;font-weight:600;letter-spacing:.5px}
  p{opacity:.6;font-size:13px;margin:12px 0 0}
</style>
</head>
<body>
<h1>Snake — <span id="score">0</span></h1>
<canvas id="c" width="400" height="400"></canvas>
<p>Arrow keys or WASD to move</p>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),G=20,N=20;
let snake=[{x:10,y:10}],dir={x:1,y:0},food=rand(),score=0,dead=false;
function rand(){return{x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if((k==='arrowup'||k==='w')&&dir.y!==1)dir={x:0,y:-1};
  else if((k==='arrowdown'||k==='s')&&dir.y!==-1)dir={x:0,y:1};
  else if((k==='arrowleft'||k==='a')&&dir.x!==1)dir={x:-1,y:0};
  else if((k==='arrowright'||k==='d')&&dir.x!==-1)dir={x:1,y:0};
  else if(dead&&k===' '){snake=[{x:10,y:10}];dir={x:1,y:0};food=rand();score=0;dead=false}
});
setInterval(()=>{
  if(dead)return;
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){dead=true;return}
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){score++;document.getElementById('score').textContent=score;food=rand()}
  else snake.pop();
  ctx.fillStyle='#1e293b';ctx.fillRect(0,0,400,400);
  ctx.fillStyle='#ef4444';ctx.fillRect(food.x*G,food.y*G,G-1,G-1);
  ctx.fillStyle='#22c55e';snake.forEach(s=>ctx.fillRect(s.x*G,s.y*G,G-1,G-1));
  if(dead){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,400,400);ctx.fillStyle='#fff';ctx.font='24px sans-serif';ctx.textAlign='center';ctx.fillText('Game Over — press space',200,200)}
},100);
</script>
</body>
</html>
