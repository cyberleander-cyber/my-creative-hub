<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Pong</title>
<style>html,body{margin:0;height:100%;background:#000;display:flex;align-items:center;justify-content:center}canvas{background:#000;border:2px solid #fff}</style>
</head>
<body>
<canvas id="c" width="600" height="400"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let p={y:170},a={y:170},b={x:300,y:200,vx:4,vy:3},s=[0,0],keys={};
addEventListener('keydown',e=>keys[e.key]=1);addEventListener('keyup',e=>keys[e.key]=0);
function loop(){
  if(keys['ArrowUp'])p.y-=6;if(keys['ArrowDown'])p.y+=6;
  p.y=Math.max(0,Math.min(340,p.y));
  if(b.y<a.y+30)a.y-=4;else if(b.y>a.y+30)a.y+=4;
  a.y=Math.max(0,Math.min(340,a.y));
  b.x+=b.vx;b.y+=b.vy;
  if(b.y<0||b.y>400)b.vy*=-1;
  if(b.x<20&&b.y>p.y&&b.y<p.y+60)b.vx=Math.abs(b.vx);
  if(b.x>580&&b.y>a.y&&b.y<a.y+60)b.vx=-Math.abs(b.vx);
  if(b.x<0){s[1]++;b={x:300,y:200,vx:4,vy:3}}
  if(b.x>600){s[0]++;b={x:300,y:200,vx:-4,vy:3}}
  x.fillStyle='#000';x.fillRect(0,0,600,400);
  x.fillStyle='#fff';x.fillRect(10,p.y,10,60);x.fillRect(580,a.y,10,60);
  x.fillRect(b.x,b.y,8,8);
  x.font='24px monospace';x.fillText(s[0],270,40);x.fillText(s[1],320,40);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
